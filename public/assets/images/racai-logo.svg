<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64">
  <defs>
    <linearGradient id="racai_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0067da"/>
      <stop offset="100%" stop-color="#003e8a"/>
    </linearGradient>
    <linearGradient id="racai_gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Emblem Icon: Open Book with Ascending Holy Spirit Flame & Cross -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <!-- Base Book Shield / Pages -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#0f172a" />
    <!-- Gradient accent border -->
    <rect x="1" y="1" width="50" height="50" rx="13" stroke="url(#racai_gold)" stroke-width="1.5" fill="none" opacity="0.6"/>
    
    <!-- Open Bible Pages -->
    <path d="M14 38 C 20 34, 25 35, 26 38 C 27 35, 32 34, 38 38 L38 23 C 32 20, 27 21, 26 23 C 25 21, 20 20, 14 23 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Ascending Flame of Wisdom & Light -->
    <path d="M26 10 C 29 14, 32 17, 30 21 C 28 23, 24 23, 23 20 C 22 17, 24 13, 26 10 Z" fill="url(#racai_gold)"/>
    <path d="M26 13 C 27 15, 29 17, 28 19 C 27 20, 25 20, 24.5 18.5 C 24 17, 25 15, 26 13 Z" fill="#ffffff" opacity="0.8"/>

    <!-- Subtle Cross Indicator in Center -->
    <line x1="26" y1="24" x2="26" y2="36" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="22" y1="28" x2="30" y2="28" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="70" y="34" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" fill="#0f172a" letter-spacing="-0.5">RACA<tspan fill="#0067da">i</tspan></text>
  
  <rect x="156" y="16" width="76" height="20" rx="4" fill="#0067da" opacity="0.1"/>
  <text x="162" y="31" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#0067da" letter-spacing="1.8">TRAINING</text>

  <text x="71" y="49" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748b" letter-spacing="0.5">ROCK OF AGES CHRISTIAN ASSEMBLY</text>
</svg>
